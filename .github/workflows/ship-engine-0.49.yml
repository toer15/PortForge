# Optional Windows ship: build Engine 1.31 + PortForge 0.49 artifacts.
# Trigger manually. Does not replace local tools/ship-0.49.ps1 when MSYS is already warm.
name: Ship Engine 0.49

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout PortForge
        uses: actions/checkout@v4

      - name: Setup MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git make patch perl patchutils
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-nasm
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-ccache

      - name: Restore Engine 1.30 src from release 0.47
        shell: bash
        run: |
          set -euo pipefail
          gh release download 0.47 --repo toer15/PortForge -p 'PortForge-0.47-Windows-and-Source.zip'
          python - <<'PY'
          import zipfile, os, shutil
          from pathlib import Path
          z=zipfile.ZipFile('PortForge-0.47-Windows-and-Source.zip')
          out=Path('engine')
          # Keep VERSION/FEATURES/patch from checkout; restore src tree from 0.47 Source/engine/src
          if (out/'src').exists():
              shutil.rmtree(out/'src')
          for n in z.namelist():
              nn=n.replace('\\','/')
              if not nn.startswith('Source/engine/src/'):
                  continue
              rel=nn[len('Source/engine/'):]
              dest=out/rel
              if nn.endswith('/'):
                  dest.mkdir(parents=True, exist_ok=True)
                  continue
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(z.read(n))
          print('restored', sum(1 for _ in (out/'src').rglob('*')), 'paths')
          PY
          python tools/upgrade-engine-src-1.31.py engine/src
          test "$(tr -d '\r\n' < engine/VERSION)" = "1.31"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and package Engine
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd engine
          ./build-engine.sh
          ./package-engine.sh
          grep -q 'version=1.31' package/ENGINE.txt
          ls -la package/scarletnx.exe

      - name: Build app + release zips
        shell: pwsh
        run: |
          .\build-native.ps1
          .\build-release.ps1 -Version 0.49 -SkipBuild
          Get-ChildItem build\release-0.49 | Format-Table Name, Length

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portforge-0.49
          path: build/release-0.49/*

      - name: Publish GitHub release 0.49
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 0.49 --repo toer15/PortForge >/dev/null 2>&1; then
            echo "Release 0.49 already exists; uploading/replacing assets"
            gh release upload 0.49 build/release-0.49/* --repo toer15/PortForge --clobber
          else
            gh release create 0.49 \
              --repo toer15/PortForge \
              --title 'PortForge 0.49 / Engine 1.31' \
              --notes-file VALIDATION-0.49.md \
              --target "${GITHUB_SHA}" \
              build/release-0.49/PortForge-0.49-Windows-and-Source.zip \
              build/release-0.49/PortForge-0.49-source.zip \
              build/release-0.49/PortForge-Setup-0.49.exe \
              build/release-0.49/PortForge-0.49-SHA256.txt
          fi
